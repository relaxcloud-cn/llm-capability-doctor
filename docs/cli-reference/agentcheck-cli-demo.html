;overflow-wrap:anywhere}.command{display:flex;align-items:start;gap:9px;color:#b7c7dc;margin:0 0 14px;font-size:11px}.prompt{color:var(--green);user-select:none}.command code{font:inherit;white-space:pre-wrap}.dim{color:var(--dim)}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.cyan{color:var(--cyan)}.white{color:#e7eef9}.startup{padding-bottom:12px;font-size:11px}.startup-line{min-height:21px}.symbol{display:inline-block;min-width:17px}.run-header{border-top:1px solid #263245;padding:14px 0 12px}.run-header strong{color:var(--cyan);font-weight:650}.run-header .meta{font-size:10px;color:#899bb3;margin-top:2px}.checks{display:flex;flex-direction:column;gap:6px}.check-row{display:grid;grid-template-columns:18px 151px minmax(0,1fr) auto;gap:7px;align-items:start;min-height:25px}.check-name{color:#bfcbdb;font-weight:450}.check-result{font-size:11px;line-height:1.8;padding-top:1px}.elapsed{font-size:10px;color:#72849d;padding-top:1px;white-space:nowrap}.detail{padding-left:24px;color:#95acc7;font-size:10px;line-height:1.9}.subtasks{padding:1px 0 7px 25px;font-size:10px;color:#8ba0bb}.subtask{display:flex;gap:6px;align-items:baseline}.subtask span:last-child{flex:1}.progress{border-top:1px solid #253246;margin-top:16px;padding-top:13px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;font-size:10px}.bar{white-space:nowrap;letter-spacing:-1px;color:var(--green);font-size:13px}.bar .empty{color:#334358}.summary{border-top:1px solid #29374c;margin-top:16px;padding-top:14px;font-size:11px}.summary .verdict{font-size:13px;font-weight:650;margin:4px 0}.summary .paths{color:#859bb8;line-height:1.95;margin-top:8px;white-space:pre-wrap}.phase-note{color:var(--yellow);padding-top:15px;font-size:11px}.handoff{padding:18px 0 6px;border-top:1px solid #2a374b;margin-top:8px;line-height:2}.handoff p{font-size:11px;color:#a6b7ce}.handoff strong{font-size:14px;color:#dfebfa}.cursor{display:inline-block;width:7px;height:13px;background:#7186a3;vertical-align:middle;animation:blink 1.05s step-end infinite}.log-output{margin:0;font:inherit;font-size:11px;line-height:1.95;max-height:590px;overflow:auto;scrollbar-color:#45566c #172031;white-space:pre-wrap;overscroll-behavior:contain}.log-line{min-height:20px}.log-time{color:#5e748e;margin-right:8px;font-size:10px}.footer{display:flex;justify-content:space-between;gap:20px;align-items:start;padding:14px 3px 0;font-size:11px;color:#7e8da1}.footer p{max-width:760px}.footer a{white-space:nowrap}.live-status{margin-top:4px;font-size:10px;color:#8c99aa}.spinner{display:inline-block}.phase-note:empty{display:none}.hidden{display:none!important}@keyframes blink{50%{opacity:0}}@media(max-width:760px){.page{padding:20px 15px}.heading{align-items:start}.heading-link{display:none}h1{font-size:23px}.controls{padding:12px}.control-top{align-items:start}.controls-left{width:100%}.controls-right{width:100%;justify-content:space-between}.select-wrap{font-size:10px}.scenario-select{max-width:205px}.phases{gap:3px}.phase{font-size:10px;padding:7px 4px;gap:5px}.phase-number{width:19px;height:19px;font-size:9px}.terminal-bar{padding:10px 12px}.terminal-title{font-size:10px}.dots{display:none}.view-tabs button{font-size:9px;padding:4px 7px}.console{padding:17px 13px;font-size:11px;min-height:420px}.command{font-size:10px}.startup{font-size:10px}.check-row{grid-template-columns:14px 100px minmax(0,1fr);gap:5px;min-height:29px}.check-name{font-size:10px}.check-result{font-size:10px}.elapsed{grid-column:3;display:none}.detail{font-size:9px;padding-left:19px}.subtasks{font-size:9px;padding-left:19px}.summary{font-size:10px}.summary .verdict{font-size:12px}.bar{font-size:10px}.progress{gap:7px;font-size:9px}.footer{display:block;font-size:10px}.footer a{display:inline-block;margin-top:7px}.log-output{font-size:10px;max-height:610px}.demo-badge{font-size:9px}.btn{font-size:11px;padding:0 10px}.scrubber span{font-size:9px}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}@media print{.controls,.phases,.view-tabs,.footer,.heading-link{display:none}.page{padding:0}.terminal{box-shadow:none}.console{min-height:0}.log-output{max-height:none;overflow:visible}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

<body>
<main class="page">
 <div class="top"><div class="brand"><span class="brand-mark">A</span>AgentCheck</div><span class="demo-badge">交互演示 · 不执行真实检测</span></div>
 <div class="heading"><div><h1>CLI 执行全过程</h1><p class="subtitle">启动检查 → 自动选择界面 → 实时进度 → 检测结论与报告</p></div><a class="heading-link" href="../report-reference/agentcheck-baseline-report.html#comparison" target="_blank" rel="noopener">查看已确认的报告样式 ↗</a></div>
 <section class="controls" aria-label="演示控制">
  <div class="control-top"><div class="controls-left"><button class="btn primary" id="play" type="button">▶ 播放演示</button><button class="btn" id="restart" type="button">重新播放</button><button class="btn" id="finish" type="button">查看结束结果</button></div><div class="controls-right"><label class="select-wrap">启动场景<select class="scenario-select" id="scenario" aria-label="启动场景"><option value="cli">无桌面环境 · 纯 CLI</option><option value="gui">有桌面环境 · 打开 GUI</option><option value="fallback">GUI 启动失败 · 回退 CLI</option><option value="error">连接失败 · 停止检测</option></select></label><label class="select-wrap">速度<select id="speed" aria-label="速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div></div>
  <div class="scrubber"><span>演示进度</span><input id="seek" type="range" min="0" max="221" step="0.1" value="0" aria-label="拖动查看执行过程"><span id="playback-time">00:00 / 00:55</span></div>
 </section>
 <nav class="phases" aria-label="跳转到执行阶段"><button type="button" class="phase current" data-phase="startup"><span class="phase-number">01</span>启动检查</button><button type="button" class="phase" data-phase="interface"><span class="phase-number">02</span>模型接口检测</button><button type="button" class="phase" data-phase="agent"><span class="phase-number">03</span>智能体任务检测</button><button type="button" class="phase" data-phase="report"><span class="phase-number">04</span>结论与报告</button></nav>
 <section class="terminal" aria-label="CLI 终端演示">
  <div class="terminal-bar"><div class="terminal-title"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>agentcheck — <span id="terminal-mode">实时终端</span></span></div><div class="view-tabs" role="group" aria-label="终端显示形式"><button type="button" id="view-terminal" aria-pressed="true">原地刷新</button><button type="button" id="view-log" aria-pressed="false">逐行日志</button></div></div>
  <div class="console"><div class="command"><span class="prompt">$</span><code>agentcheck --url https://model.example/v1 --model customer-model</code></div><div id="screen" aria-live="off"></div></div>
 </section>
 <div class="footer"><div><p id="scene-copy">演示一次完整检测：7 项通过，1 项未通过。界面形式参考原 CLI，检测项使用新的 8 项。</p><p class="live-status" id="live-status" role="status" aria-live="polite">点击播放，约 55 秒看完；也可拖动进度查看任意阶段。所有配置、用时与结果均为虚构示例。</p></div><a id="report-link" class="hidden" href="../report-reference/agentcheck-baseline-report.html" target="_blank" rel="noopener">打开示例报告 ↗</a></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[
 {id:'response',name:'接口与响应',start:4,end:9,title:'普通响应、流式响应均正常'},
 {id:'tools',name:'工具调用',start:10,end:17,title:'工具选择、参数和结果使用均正确'},
 {id:'schema',name:'结构化输出',start:18,end:23,title:'输出格式和字段内容符合要求'},
 {id:'context',name:'长上下文',start:24,end:44,title:'模型支持最大上下文为 131072 tokens'},
 {id:'performance',name:'并发性能测试',start:45,end:63.6,title:'模型4并发测试通过，最长用时18.6秒，平均用时15.2秒'},
 {id:'continuous',name:'连续工具执行',start:65,end:134,title:'连续执行多个工具，任务结果正确',agent:true},
 {id:'recovery',name:'工具故障恢复',start:65,end:194,title:'工具出错后恢复，任务结果正确',agent:true},
 {id:'multiturn',name:'多轮继续执行',start:106,end:211,title:'指定修改未生效，仍保留旧内容',agent:true,failed:true}
];
const tasks=[
 {id:'continuous',run:1,start:65,end:95,steps:[[65,'读取材料'],[72,'整理记录'],[87,'写入结果并核对']]},
 {id:'recovery',run:1,start:65,end:105,steps:[[65,'读取材料'],[77,'读取暂时失败，正在重试'],[85,'读取恢复，继续整理'],[99,'写入结果并核对']]},
 {id:'multiturn',run:1,start:106,end:158,steps:[[106,'第一轮：整理并保存结果'],[126,'第二轮：新增记录并修改版本'],[148,'核对新增、修改和保留内容']]},
 {id:'continuous',run:2,start:106,end:134,steps:[[106,'读取材料'],[117,'整理记录'],[130,'写入结果并核对']]},
 {id:'recovery',run:2,start:159,end:194,steps:[[159,'读取材料'],[166,'读取暂时失败，正在重试'],[174,'读取恢复，继续整理'],[187,'写入结果并核对']]},
 {id:'multiturn',run:2,start:159,end:211,failed:true,steps:[[159,'第一轮：整理并保存结果'],[180,'第二轮：新增记录并修改版本'],[203,'核对修改结果']]}
];
const detailSteps={
 response:[[4,'检查普通响应'],[6,'检查流式响应及结束状态']],
 tools:[[10,'检查工具选择与参数'],[14,'回传工具结果，检查是否继续使用']],
 schema:[[18,'发送指定格式要求'],[21,'核对输出结构与字段内容']],
 context:[[24,'开始探测上下文长度'],[28,'探测更大的上下文窗口'],[36,'继续确认可用范围'],[41,'核对容量边界及实际 token 计量']],
 performance:[[45,'同时发送 4 个请求'],[56.8,'1 / 4 个请求完成'],[59.2,'2 / 4 个请求完成'],[61.2,'3 / 4 个请求完成']]
};
const sceneLengths={cli:221,fallback:233,gui:6,error:3};
const spin=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
let currentTime=0,playing=false,view='terminal',scene='cli',speed=1,lastTick=0,lastPhase='';
function offset(){return scene==='fallback'?12:0}
function timeScale(){return scene==='gui'||scene==='error'?1:4}
function engineTime(){return currentTime-offset()}
function clock(value){const total=Math.max(0,Math.floor(value));return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}
function duration(value){return value<60?Math.max(0,value).toFixed(1).replace(/\.0$/,'')+'秒':Math.floor(value/60)+'分'+Math.floor(value%60)+'秒'}
function marker(status){return status==='passed'?'<span class="green">✓</span>':status==='failed'?'<span class="red">✗</span>':status==='running'?'<span class="yellow spinner">'+spin[Math.floor(currentTime*3)%spin.length]+'</span>':'<span class="dim">○</span>'}
function phaseAt(){if(scene==='gui'||scene==='error'||engineTime()<4)return 'startup';if(engineTime()<65)return 'interface';if(engineTime()<212)return 'agent';return 'report'}
function latestStep(steps,time){return steps.filter(([at])=>at<=time).at(-1)?.[1]||'准备中'}
function stateOf(group,t){if(t<group.start)return 'waiting';if(t>=group.end)return group.failed?'failed':'passed';if(group.agent&&!tasks.some(task=>task.id===group.id&&t>=task.start&&t<task.end))return 'waiting-next';return 'running'}
function startupEvents(){
 const events=[{at:0,text:'正在检查模型配置与连接…',tone:'dim',mark:'·'}];
 if(scene==='error')return [...events,{at:1,text:'配置完整',tone:'green',mark:'✓'},{at:2,text:'模型连通性失败：API 密钥未通过验证',tone:'red',mark:'✗'},{at:3,text:'未开始正式检测，请修正密钥后重新运行',tone:'red',mark:'✗'}];
 events.push({at:1,text:'配置完整',tone:'green',mark:'✓'},{at:2,text:'模型连通性通过（耗时 1200ms）',tone:'green',mark:'✓'});
 if(scene==='gui')events.push({at:3,text:'桌面环境可用，正在启动 GUI…',tone:'cyan',mark:'·'},{at:5,text:'GUI 窗口已显示',tone:'green',mark:'✓'},{at:6,text:'GUI 已启动，配置已传入，检测将自动继续',tone:'green',mark:'✓'});
 else if(scene==='fallback')events.push({at:3,text:'桌面环境可用，正在启动 GUI…',tone:'cyan',mark:'·'},{at:13,text:'GUI 未在 10 秒内确认启动，回退到纯 CLI',tone:'yellow',mark:'!'},{at:15,text:'启动方式  CLI（继续使用原配置）',tone:'cyan',mark:'·'});
 else events.push({at:3,text:'桌面环境不可用 · 启动方式  CLI',tone:'cyan',mark:'·'});
 return events;
}
function logEvents(){
 const o=offset();let events=startupEvents().map(e=>({...e,text:'[启动检查] '+e.text}));
 if(scene==='gui'||scene==='error')return events;
 events.push({at:4+o,text:'[开始] 模型 customer-model · 共 8 个检测项目',tone:'cyan'});
 for(const group of groups){events.push({at:group.start+o,text:'[开始] '+group.name,tone:'yellow'});if(!group.agent)for(const [at,label]of detailSteps[group.id])events.push({at:at+o,text:'['+group.name+'] '+label,tone:'dim'});events.push({at:group.end+o,text:'['+(group.failed?'未通过':'通过')+'] '+group.name+'：'+group.title,tone:group.failed?'red':'green'});}
 for(const task of tasks){const name=groups.find(g=>g.id===task.id).name+' · 第'+task.run+'次';for(const[at,label]of task.steps)events.push({at:at+o,text:'['+name+'] '+label,tone:label.includes('失败')?'yellow':'dim'});events.push({at:task.end+o,text:'['+name+'] '+(task.failed?'指定修改未生效，R-07 仍为旧版本':'结果正确，任务正常结束'),tone:task.failed?'red':'green'});}
 events.push({at:212+o,text:'[完成] 全部检测结束 · 7 项通过，1 项未通过',tone:'white'},{at:213+o,text:'[报告] 正在生成报告和整理检测记录…',tone:'yellow'},{at:220+o,text:'[报告] HTML：./agentcheck-report/report.html',tone:'cyan'},{at:220.2+o,text:'[记录] ZIP：./agentcheck-report/records.zip',tone:'cyan'},{at:221+o,text:'[结论] 暂不建议接入平台：指定修改未生效，仍保留旧内容',tone:'red'});
 return events.sort((a,b)=>a.at-b.at);
}
function renderStartup(){return '<div class="startup">'+startupEvents().filter(e=>e.at<=currentTime).map(e=>'<div class="startup-line '+e.tone+'"><span class="symbol">'+e.mark+'</span>'+escapeHtml(e.text)+'</div>').join('')+'</div>'}
function renderTasks(group,t){
 return '<div class="subtasks">'+tasks.filter(task=>task.id===group.id).sort((a,b)=>a.run-b.run).map(task=>{const status=t<task.start?'waiting':t<task.end?'running':task.failed?'failed':'passed';const detail=status==='waiting'?'等待执行':status==='running'?latestStep(task.steps,t):task.failed?'指定修改未生效':'结果正确';return '<div class="subtask">'+marker(status)+'<span>第 '+task.run+' 次</span><span class="'+(status==='running'?'cyan':status==='failed'?'red':'dim')+'">'+escapeHtml(detail)+'</span></div>'}).join('')+'</div>';
}
function renderTerminal(){
 let html=renderStartup();const t=engineTime();
 if(scene==='gui'){if(currentTime>=6)html+='<div class="handoff"><strong>已交给 GUI 展示检测过程</strong><p>当前 CLI 启动进程结束。GUI 使用原配置自动开始检测，无需再次填写或点击开始。</p><p class="dim">这里只演示启动交接，GUI 界面另行对齐。</p></div>';else html+='<span class="cursor" aria-hidden="true"></span>';return html}
 if(scene==='error'){if(currentTime>=3)html+='<div class="handoff"><strong class="red">检测未开始</strong><p>修正配置后重新运行。没有生成能力结论或检测报告。</p></div>';return html}
 if(t<4)return html+'<span class="cursor" aria-hidden="true"></span>';
 html+='<div class="run-header"><strong>AgentCheck</strong> <span class="dim">模型服务能力检测</span><div class="meta">模型 customer-model　地址 https://model.example/v1</div></div><div class="checks">';
 for(const group of groups){const status=stateOf(group,t),done=tasks.filter(task=>task.id===group.id&&t>=task.end).length;const result=status==='waiting'?'等待中':status==='waiting-next'?'等待下次执行 · 已完成 '+done+' / 2 次':status==='running'?'进行中'+(group.agent?' · 已完成 '+done+' / 2 次':''):group.title;const tone=status==='passed'?'green':status==='failed'?'red':status==='running'?'yellow':'dim';
 html+='<div class="check" data-check="'+group.id+'" data-status="'+status+'"><div class="check-row">'+marker(status)+'<span class="check-name">'+escapeHtml(group.name)+'</span><span class="check-result '+tone+'">'+escapeHtml(result)+'</span><span class="elapsed">'+(status==='waiting'?'':duration(Math.min(t,group.end)-group.start))+'</span></div>';
 if(status==='running')html+=group.agent?renderTasks(group,t):'<div class="detail">└ '+escapeHtml(latestStep(detailSteps[group.id],t))+'</div>';
 html+='</div>';
 }
 html+='</div>';const completed=groups.filter(group=>t>=group.end).length;const filled=completed*3;html+='<div class="progress"><span class="bar">'+'█'.repeat(filled)+'<span class="empty">'+'░'.repeat(24-filled)+'</span></span><span class="cyan">'+Math.round(completed/8*100)+'%</span><span class="dim">已完成 '+completed+' / 8 项 · 已用 '+duration(Math.max(0,currentTime-4-offset()))+'</span></div>';
 if(t>=212&&t<220)html+='<div class="phase-note">'+marker('running')+' 正在生成报告和整理检测记录…</div>';
 if(t>=220)html+='<div class="summary"><div class="white">检测结果　7 项通过 · 1 项未通过</div><div class="verdict red">结论　暂不建议接入平台</div><div class="dim">问题　多轮继续执行：指定修改未生效，仍保留旧内容。</div><div class="paths">[报告] HTML：./agentcheck-report/report.html\n[记录] ZIP ：./agentcheck-report/records.zip</div></div>';
 return html;
}
function render(){
 const phase=phaseAt();document.querySelectorAll('.phase').forEach(button=>{const order=['startup','interface','agent','report'];button.classList.toggle('current',button.dataset.phase===phase);button.classList.toggle('done',order.indexOf(button.dataset.phase)<order.indexOf(phase));button.disabled=(scene==='gui'||scene==='error')&&button.dataset.phase!=='startup'});
 const oldLog=$('log-output');const follow=!oldLog||oldLog.scrollHeight-oldLog.scrollTop-oldLog.clientHeight<40;const oldTop=oldLog?.scrollTop||0;
 if(view==='terminal')$('screen').innerHTML=renderTerminal();else{$('screen').innerHTML='<div id="log-output" class="log-output" aria-label="逐行执行日志">'+logEvents().filter(e=>e.at<=currentTime).map(e=>'<div class="log-line '+e.tone+'"><span class="log-time">'+clock(e.at)+'</span>'+escapeHtml(e.text)+'</div>').join('')+'</div>';const el=$('log-output');el.scrollTop=follow?el.scrollHeight:oldTop}
 $('seek').max=sceneLengths[scene];$('seek').value=currentTime;$('playback-time').textContent=clock(currentTime/timeScale())+' / '+clock(sceneLengths[scene]/timeScale());$('play').textContent=playing?'Ⅱ 暂停演示':currentTime>=sceneLengths[scene]?'▶ 再看一遍':'▶ 播放演示';$('play').setAttribute('aria-label',playing?'暂停演示':'播放演示');
 $('terminal-mode').textContent=view==='terminal'?'实时终端':'逐行日志';$('view-terminal').setAttribute('aria-pressed',String(view==='terminal'));$('view-log').setAttribute('aria-pressed',String(view==='log'));
 $('report-link').classList.toggle('hidden',(scene!=='cli'&&scene!=='fallback')||engineTime()<220);
 if(lastPhase!==phase){lastPhase=phase;$('live-status').textContent=({startup:'正在演示启动检查。',interface:'正在演示模型接口检测。',agent:'正在演示智能体任务执行，同时最多运行两个任务。',report:'正在演示检测结束与报告生成。'})[phase]+' 所有配置、用时与结果均为虚构示例。'}
 if(currentTime>=sceneLengths[scene])$('live-status').textContent='演示已结束，可重新播放或切换启动场景。未执行真实检测。';
}
function setTime(value){currentTime=Math.max(0,Math.min(sceneLengths[scene],value));if(currentTime>=sceneLengths[scene])playing=false;render()}
$('play').addEventListener('click',()=>{if(currentTime>=sceneLengths[scene])currentTime=0;playing=!playing;lastTick=performance.now();render()});
$('restart').addEventListener('click',()=>{currentTime=0;playing=true;lastTick=performance.now();lastPhase='';render()});
$('finish').addEventListener('click',()=>{playing=false;setTime(sceneLengths[scene])});
$('seek').addEventListener('input',event=>{playing=false;setTime(Number(event.target.value))});
$('speed').addEventListener('change',event=>{speed=Number(event.target.value);lastTick=performance.now()});
$('scenario').addEventListener('change',event=>{scene=event.target.value;playing=false;currentTime=0;lastPhase='';$('scene-copy').textContent=({cli:'演示一次完整检测：7 项通过，1 项未通过。界面形式参考原 CLI，检测项使用新的 8 项。',gui:'有桌面环境时，CLI 自动打开 GUI 并传入配置，GUI 自动开始检测。',fallback:'有桌面环境，但 GUI 启动失败：说明原因，使用原配置继续纯 CLI 检测。',error:'配置或连通性检查失败：说明原因并停止，不把连接错误判成能力不通过。'})[scene];render()});
$('view-terminal').addEventListener('click',()=>{view='terminal';render()});$('view-log').addEventListener('click',()=>{view='log';render()});
for(const button of document.querySelectorAll('.phase'))button.addEventListener('click',()=>{playing=false;setTime(({startup:0,interface:4,agent:77,report:221})[button.dataset.phase]+(button.dataset.phase==='startup'?0:offset()))});
setInterval(()=>{const now=performance.now();if(playing){const delta=lastTick?(now-lastTick)/1000:0;currentTime=Math.min(sceneLengths[scene],currentTime+delta*timeScale()*speed);if(currentTime>=sceneLengths[scene])playing=false;render()}lastTick=now},120);
render();
</script>
</body>
</html>
