[package]
name = "agent-check"
version = "0.4.8"
edition = "2024"
rust-version = "1.85"

[lib]
name = "agent_check"
path = "src/lib.rs"

[[bin]]
name = "agent-check"
path = "src/main.rs"

[features]
default = []
bundled-runtime = []

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
axum = "0.8"
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
unicode-width = "0.2"
terminal_size = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1.53.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["test-util"] }

[build-dependencies]
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_System_Console"]}
