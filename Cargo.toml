[package]
name = "model-capability-doctor"
version = "0.12.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.2", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.18"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = "0.8.3"
predicates = "3"
rcgen = "0.14.8"
tempfile = "3.27.0"
tokio-rustls = "0.26.4"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[test]]
name = "cli_self_analysis"
path = "src/cli_self_analysis_test.rs"

[[test]]
name = "cli_opencodex"
path = "src/cli_opencodex_test.rs"
