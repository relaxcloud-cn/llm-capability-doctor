[package]
name = "llm-capability-doctor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
bundled-runtime = []

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1.53.0", features = ["rt", "time"] }
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
tempfile = "3"

[build-dependencies]
flate2 = "1"
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
