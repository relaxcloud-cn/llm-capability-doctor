name: Build Single-File CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single executable
        run: npm run build:single

      - name: Smoke test
        shell: bash
        run: |
          executable="$(find dist -maxdepth 1 -type f -name 'llmprobe-*' | head -n 1)"
          test -n "$executable"
          "$executable" --version
          "$executable" --help >/dev/null

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: llmprobe-${{ runner.os }}-${{ runner.arch }}
          path: dist/llmprobe-*
          if-no-files-found: error
